# WaterBuoy configuration. Copy to config/config.toml and edit.

[device]
# Used as the MQTT client id and in topic names. Should match the AWS IoT Thing name.
thing_name = "waterbuoy-01"

[capture]
interval_seconds = 300          # 5 minutes
align_to_clock = true           # capture at :00, :05, :10 ... instead of 5 min after start
# Any camera setting placed here is the default for every [[camera]] below.
jpeg_quality = 90
warmup_frames = 30              # usb: frames dropped before each shot so exposure settles (~1 s)

# One [[camera]] table per camera; every picture cycle captures from all of them.
# Every listed camera must be present: the service will not start without it.
# Run `python -m waterbuoy --list-cameras` to print ready-made tables for attached cameras.
#
#   name          used in file names (20261124T190224Z_<name>.jpg) and IoT messages
#   backend       "usb" (any UVC webcam) | "picamera2" | "rpicam-still" (Pi ribbon camera) | "mock"
#   device        usb: /dev/v4l/by-id/... link (or /dev/v4l/by-path/... = fixed USB port)
#                 ribbon: optional libcamera Id; otherwise `index` picks the camera (0, 1)
#   width/height  0 = largest the camera supports; else must be a supported mode
#   input_format  usb: "auto" (MJPEG if possible, else raw YUV) | "mjpeg" | "yuyv422" | ...

[[camera]]
name = "cam0"
backend = "usb"
device = "/dev/video0"          # better: the /dev/v4l/by-id/usb-...-video-index0 link
width = 1920
height = 1080

# A second camera, e.g. a Pi ribbon camera:
# [[camera]]
# name = "csi0"
# backend = "picamera2"
# index = 0
# width = 2304
# height = 1296

[storage]
# Point this at the mounted hard drive, e.g. /mnt/hdd/waterbuoy/images
base_dir = "/home/pi/waterbuoy-data/images"
# When free space drops below this, the oldest images are deleted.
min_free_mb = 1024

[iot]
enabled = false
endpoint = "xxxxxxxxxxxxxx-ats.iot.us-east-1.amazonaws.com"
cert_path = "certs/device.pem.crt"
key_path = "certs/private.pem.key"
ca_path = "certs/AmazonRootCA1.pem"
port = 8883
keep_alive_seconds = 30
# Topics; {thing} is replaced with device.thing_name
topic_prefix = "waterbuoy/{thing}"

[algae]
# Algal-bloom screening of every capture (colour heuristic; result is added to the
# IoT capture message). Tune on your own images: waterbuoy-algae scan <dir> --sort-into out/ --overlay
enabled = true
roi = [0.0, 0.0, 1.0, 1.0]      # [x0, y0, x1, y1] fractions; crop out sky/shore/buoy parts
min_saturation = 0.30           # greyer pixels (foam, glare, colour cast) are ignored
hue_min = 60.0                  # degrees, yellow-green
hue_max = 170.0                 # degrees, blue-green
min_exg = 0.04                  # excess-green index threshold
green_margin = 0.12             # green must beat red and blue by 12%
min_valid_fraction = 0.25       # fewer usable pixels (night/fog) -> "unknown"
suspect_fraction = 0.05         # >= 5% bloom-coloured pixels -> "suspect"
bloom_fraction = 0.20           # >= 20% -> "bloom"
