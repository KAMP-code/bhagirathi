[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waterbuoy"
version = "0.1.0"
description = "Water buoy camera node: periodic image capture with AWS IoT Core connectivity"
requires-python = ">=3.11"
dependencies = [
    "awsiotsdk>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
waterbuoy = "waterbuoy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
