[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waterbuoy"
version = "0.1.0"
description = "Water buoy camera node: periodic image capture with AWS IoT Core connectivity"
requires-python = ">=3.11"
dependencies = [
    "awsiotsdk>=1.21",
    "numpy>=1.24",
    "pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
waterbuoy = "waterbuoy.__main__:main"
waterbuoy-algae = "waterbuoy.algae:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "camera: needs a real Raspberry Pi camera (skipped if none; WATERBUOY_REQUIRE_CAMERA=1 to fail instead)",
    "no_camera: runs only when no camera is attached (error-path checks)",
    "rpicam: needs the rpicam-still binary",
]
