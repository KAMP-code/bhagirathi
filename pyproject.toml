[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waterbuoy"
version = "0.1.0"
description = "Water buoy camera node: periodic image capture with AWS IoT Core connectivity"
requires-python = ">=3.11"
dependencies = [
    "awsiotsdk>=1.21",
    "numpy>=1.24",
    "pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["ultralytics>=8.3"]   # water_classifier (YOLOv8)

[project.scripts]
waterbuoy = "waterbuoy.__main__:main"
waterbuoy-algae = "waterbuoy.algae:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # lgpio's SWIG bindings (system package) on Python 3.13
    "ignore:builtin type swig:DeprecationWarning",
]
